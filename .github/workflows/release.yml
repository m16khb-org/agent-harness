name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Same-repo formula PR + GitHub Release use the default token; no PAT,
          # no separate tap repo. The formula lands as a PR to protected main.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
