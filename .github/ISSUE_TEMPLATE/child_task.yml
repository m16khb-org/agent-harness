name: Child Task
description: IssueOps parent issue 아래의 provider-native child task를 등록합니다.
title: "task: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        큰 IssueOps parent를 provider-native child task로 나눌 때 사용합니다. GitHub에서는 sub-issue, GitLab에서는 child work item/Task로 연결해야 합니다.

        GitHub CLI로 기존 parent에 연결할 때는 child 생성 후 `gh issue edit <parent-number-or-url> --add-sub-issue <child-number-or-url>`로 provider-native sub-issue 관계를 확인하세요.

  - type: input
    id: parent_issue
    attributes:
      label: 부모 이슈
      description: parent issue URL 또는 번호를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 작업 목표
      description: 이 child task가 독립적으로 끝내야 할 목표를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: parent와 분리해 검증 가능한 완료 기준을 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: 비목표
      description: 이 child task가 맡지 않을 범위를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 검증
      description: 실행할 테스트, 빌드, 스모크 체크, 문서 검증을 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: parent_merge
    attributes:
      label: 부모 브랜치 병합 조건
      description: child branch가 parent branch에 병합되기 전 필요한 검증과 리뷰 조건을 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: cleanup
    attributes:
      label: child-only cleanup 규칙
      description: child 완료 후 닫을 artifact와 parent에 남길 후속 상태를 적어 주세요.
    validations:
      required: true
