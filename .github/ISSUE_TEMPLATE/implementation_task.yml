name: 구현 작업
description: 문제, 근거, 완료 기준, 검증이 정리된 실행 단위를 등록합니다.
title: ""
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        이미 실행 방향이 잡힌 작업 단위에 사용합니다. 아이디어 탐색이나 큰 구조 결정은 기능 요청 또는 제안 템플릿을 먼저 사용하세요.

        좋은 예시는 문제, 현재 근거, 완료 기준, 비목표, 구현 범위, 검증 명령, 위험을 모두 검증 가능한 문장으로 적습니다. 나쁜 예시는 "좋게 만들기", "필요한 파일 추가", "잘 되는지 확인"처럼 범위와 검증이 모호합니다.

  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 해결하려는 문제와 왜 지금 필요한지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 현재 근거
      description: 실제 파일, 명령 결과, 로그, 사용자 피드백, 확인된 제약을 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: related_labels
    attributes:
      label: 관련 이슈/라벨 판단
      description: 중복 또는 관련 이슈, 선택/거절 라벨, 수동 override 이유를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 검증 가능한 acceptance criteria를 체크리스트로 적어 주세요.
      placeholder: |
        - [ ] 지정된 파일이나 템플릿이 추가 또는 수정된다.
        - [ ] 변경 범위가 이 이슈의 비목표를 넘지 않는다.
        - [ ] 명시한 검증 명령이 통과한다.
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: 비목표
      description: 이번 작업에서 하지 않을 일을 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 구현 범위
      description: 포함할 변경과 분리해야 할 관련 없는 변경을 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 검증
      description: 실행할 테스트, 빌드, 스모크 체크, 품질 게이트를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: diagram
    attributes:
      label: 다이어그램
      description: 리뷰어가 흐름, 상태 전이, adapter 경계를 더 빨리 이해할 때만 포함해 주세요. 단순 파일 추가나 작은 수정이면 "필요 없음"이라고 적어 주세요.
    validations:
      required: false

  - type: textarea
    id: risks
    attributes:
      label: 위험과 트레이드오프
      description: 남는 리스크, 대안, 선택 이유를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: feedback
    attributes:
      label: 피드백 기록
      description: 사용자 피드백과 요구사항 변경 이력을 적어 주세요.
    validations:
      required: false

  - type: textarea
    id: guideline
    attributes:
      label: 가이드라인 참조
      description: 관련 project docs, IssueOps guide, upstream docs 경로를 적어 주세요.
      value: |
        - docs/superpowers/specs/issueops-issue-pr-guidelines.md
    validations:
      required: true
