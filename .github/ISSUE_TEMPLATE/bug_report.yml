name: 버그 리포트
description: 재현 가능한 결함이나 회귀를 보고합니다.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        재현 가능한 결함만 이 템플릿으로 작성해 주세요. 보안 관련 내용이나 secret 원문은 이슈에 남기지 마세요.

        좋은 예시는 재현 절차, 기대/실제 동작, 환경, 현재 근거가 서로 연결됩니다. 나쁜 예시는 "안 됩니다" 한 줄만 남깁니다.

  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 어떤 동작이 잘못됐는지 간결하게 설명해 주세요.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: 영향 표면
      description: 문제가 가장 직접적으로 드러나는 영역을 고르세요.
      options:
        - CLI
        - MCP
        - hook
        - skill
        - installer/bootstrap
        - docs
        - tests
        - other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 환경과 버전
      description: OS, Go 버전, `issueops version`, 관련 host(Codex/Claude/GitHub/GitLab) 정보를 적어 주세요.
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 가능한 한 작고 정확한 단계로 적어 주세요.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 올바른 동작과 그렇게 기대하는 이유를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제 출력, 에러, 로그 요약을 적어 주세요. secret 원문은 제거하세요.
      render: text
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 현재 근거
      description: 관련 파일, 명령 출력, PR, 이슈, 로그 위치 등 검증 가능한 근거를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: related_labels
    attributes:
      label: 관련 이슈/라벨 판단
      description: 중복 또는 관련 이슈, 선택/거절 라벨, 수동 override 이유를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 수정 완료를 판단할 수 있는 체크 가능한 기준을 적어 주세요.
      placeholder: |
        - [ ] 재현 절차가 실패에서 성공으로 바뀐다.
        - [ ] 회귀 테스트 또는 동등한 검증이 추가된다.
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: 비목표
      description: 이번 버그 수정에서 하지 않을 일을 적어 범위를 제한해 주세요.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 구현 범위
      description: 포함할 변경과 분리해야 할 관련 없는 변경을 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 검증
      description: 이미 실행했거나 수정 후 실행할 테스트, 빌드, 스모크 체크와 결과를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: 위험과 트레이드오프
      description: 호환성, 운영 영향, rollback, 남는 한계를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: feedback
    attributes:
      label: 피드백 기록
      description: 사용자 피드백, 리뷰 피드백, 요구사항 변경 이력을 적어 주세요.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 관련 제약, 우회 방법, 스크린샷이 필요한 경우 설명을 적어 주세요.
    validations:
      required: false
