<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UX Interactions QA Fixture</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; color: #222; }
      .sticky { position: sticky; top: 0; height: 60px; background: #5662d9; color: white; display: flex; align-items: center; padding: 0 20px; z-index: 10; }
      .content { padding: 20px; max-width: 560px; margin: 0 auto; }
      .spacer { height: 120vh; }
      form { margin: 24px 0; }
      label { display: block; margin-bottom: 6px; font-weight: 600; }
      input, button, select { min-height: 36px; font: inherit; padding: 6px 12px; }
      /* D5: visual order reversed vs DOM/tab order (2.4.3 mismatch) */
      .toolbar { display: flex; flex-direction: row-reverse; gap: 8px; justify-content: flex-end; }
      .dialog-backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / 40%); display: none; }
      .dialog-backdrop.open { display: block; }
      .dialog { position: fixed; top: 30%; left: 50%; transform: translateX(-50%); background: white; padding: 24px; border-radius: 8px; }
      #async-status { min-height: 20px; color: #4d5874; }
    </style>
  </head>
  <body>
    <header class="sticky">Settings</header>
    <main class="content">
      <h1>Account settings</h1>

      <form id="profile-form">
        <label for="nickname">Nickname</label>
        <input id="nickname" name="nickname" autocomplete="off">
        <button type="submit" id="save">Save profile</button>
      </form>
      <p id="async-status"></p>

      <div class="toolbar">
        <button id="cancel" type="button">Cancel</button>
        <button id="apply" type="button">Apply changes</button>
      </div>

      <button id="delete-account" type="button">Delete account</button>
      <button id="open-dialog" type="button">Open preferences</button>

      <div class="dialog-backdrop" id="backdrop">
        <div class="dialog" role="dialog" aria-label="Preferences">
          <p>Preferred language</p>
          <select id="pref-lang"><option>Korean</option><option>English</option></select>
          <button id="close-dialog" type="button">Close</button>
        </div>
      </div>

      <p><a href="#target">Jump to target section</a></p>
      <div class="spacer"></div>
      <h2 id="target" style="margin-top: 0">Target section</h2>
      <p>Content after the anchor target. The heading has no scroll-margin, so an
      anchor jump lands it under the sticky header.</p>
      <div class="spacer" style="height: 80vh"></div>
      <p>Trailing content so the page can scroll the target fully to the top.</p>
    </main>

    <script>
      // D1: no double-submit protection — button stays enabled during pending save.
      document.querySelector('#profile-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const status = document.querySelector('#async-status');
        status.textContent = 'Saving…';
        setTimeout(() => { status.textContent = 'Saved'; }, 900);
      });
      // D2: destructive action with no confirmation and no undo.
      document.querySelector('#delete-account').addEventListener('click', () => {
        document.querySelector('#async-status').textContent = 'Account deleted (no confirmation)';
      });
      // D3: dialog without Escape close, focus trap, or focus return.
      document.querySelector('#open-dialog').addEventListener('click', () => {
        document.querySelector('#backdrop').classList.add('open');
      });
      document.querySelector('#close-dialog').addEventListener('click', () => {
        document.querySelector('#backdrop').classList.remove('open');
      });
      // D6: hash "navigation" that does not update the page title.
      window.addEventListener('hashchange', () => {});
    </script>
  </body>
</html>
