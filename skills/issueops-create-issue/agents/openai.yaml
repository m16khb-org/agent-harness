interface:
  display_name: "IssueOps Create Issue"
  short_description: "Confirm the work and publish the IssueOps issue the cycle contracts on"
  default_prompt: "Use $issueops-create-issue for stage 1 of an IssueOps cycle: combine the user's own words, a codebase survey, and background research into evidence; ask only the questions whose answers would change what gets built; then record intent, domain review, the split decision, and plan prep in that order, move to grill, and publish the Korean issue through $issueops-remote-write before linking it. Run `start` from the source checkout, never a worktree. Hand off to $issueops-prepare."
