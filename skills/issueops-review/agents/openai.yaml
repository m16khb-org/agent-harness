interface:
  display_name: "IssueOps Review"
  short_description: "Run and record the adversarial review of an IssueOps plan or diff"
  default_prompt: "Use $issueops-review to run one adversarial design-review review in a fresh sub-agent and record the verdict. Pick --target plan or --target diff, read the reviewer model and effort from `issueops next --json`, give the sub-agent the full target plus the reuse, performance, backward-compatibility, and side-effect lenses, and record only after the review actually ran. A stop verdict on a plan regresses the cycle; a stop on a diff halts and reports. Verdicts are bound to the plan digest or change fingerprint, so editing the target after a verdict requires a fresh review."
