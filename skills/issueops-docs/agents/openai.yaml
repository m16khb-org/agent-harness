interface:
  display_name: "IssueOps Docs"
  short_description: "Reflect the finished implementation into the operating documents"
  default_prompt: "Use $issueops-docs when `issueops next` reports docs. Route the final diff to the .issueops documents it touches and check both directions: if the change broke a documented rule, fix the code and go back to implement; if it created a decision, a pitfall, a command, or a convention the documents do not know, append or revise through the project_docs contract. ADR is append-only. Editing docs breaks the ai-slop-clean seal, so re-seal here before recording project-docs-review with updated (docs must be in the change set) or no-change (list what you compared). Do not touch code and do not commit."
