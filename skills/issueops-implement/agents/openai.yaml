interface:
  display_name: "IssueOps Implement"
  short_description: "Implement inside the canonical worktree and exit to ai-slop-clean"
  default_prompt: "Use $issueops-implement after `issueops next` reports implement. Verify the execution lease, native actor, and canonical worktree before any mutation; enter through link-plan, the compatibility review, and the gate ledger; implement with a focused failing test first, reusing what the plan named instead of adding new abstractions; delegate bounded work through child cycles with accept/reject/drop verdicts only; recover only through returned next_command chains; and exit by moving the cycle to ai-slop-clean. Cleanup, project docs, verification, and the commit belong to later stages."
