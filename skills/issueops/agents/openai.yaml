interface:
  display_name: "IssueOps"
  short_description: "Run issue-driven problem to PR/MR cycles with 100-point quality gates"
  default_prompt: "Use $issueops to run the issue-driven cycle: clarify the problem, grill domain assumptions, run issue-preflight with a deep-interview ambiguity pass and PROMPT.md-based ideal issue prompt rewrite before remote issue creation, record portable evidence contracts for invariants/API docs/live runtime/review accountability/completion hygiene, create and link the Korean remote issue assigned to the authenticated user when repo credentials are discoverable, derive a prefix branch from the issue, create an isolated worktree, write an issue-based plan, use omo:ulw-loop plus TDD/subagent work only in that worktree during implementation, run ai-slop-clean before PR/MR drafting, collect feedback, resolve addressed review threads, draft a Korean PR/MR, offer explicit numbered choices instead of bare conclusions, and verify the 100-point IssueOps benchmark gate."
