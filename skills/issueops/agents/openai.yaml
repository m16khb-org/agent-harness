interface:
  display_name: "IssueOps"
  short_description: "Run issue-driven problem to PR/MR cycles with 100-point quality gates"
default_prompt: "Use $issueops as the lifecycle coordinator for the issue-driven cycle: problem→grill→issue→plan→compatibility-review→implement→ai-slop-clean→feedback→pr→cleanup. Delegate parent and provider-native child issue publication to $issueops-create-issue, and delegate linked GitHub PR/GitLab MR publication to $issueops-create-pr. Keep durable state, execution leases, branch/worktree gates, feedback, cleanup, specialized skills, shannon measurement, and the 100-point IssueOps benchmark under the lifecycle contract; never duplicate creation logic or bypass provider verification with raw gh/glab mutation."
