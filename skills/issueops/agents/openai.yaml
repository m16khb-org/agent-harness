interface:
  display_name: "IssueOps"
  short_description: "Run issue-driven problem to PR/MR cycles with 100-point quality gates"
  default_prompt: "Use $issueops to run the issue-driven cycle: clarify the problem, grill domain assumptions, create and link the Korean remote issue when repo credentials are discoverable, derive a prefix branch from the issue, create an isolated worktree, write an issue-based plan, use TDD/subagent work only in that worktree, collect feedback, draft a Korean PR/MR, and verify the 100-point IssueOps benchmark gate."
