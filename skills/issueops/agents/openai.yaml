interface:
  display_name: "IssueOps"
  short_description: "Route an issue-driven cycle across its ten stages"
  default_prompt: "Use $issueops to find out where a cycle is and who owns the next step. Run `issueops next --json` first, translate stage.key through the router's stage table into a skill and a Korean label, show the user the lease, the missing gates, the next command, and the exits, then offer to continue, jump to another stage, stop through $issueops-abandon, or start a fresh cycle. Blocked stages do not proceed. The router owns only the stage table and the shared invariants; every stage's work belongs to that stage's skill."
