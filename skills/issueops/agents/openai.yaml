interface:
  display_name: "IssueOps"
  short_description: "Run issue-driven problem to PR/MR cycles with 100-point quality gates"
  default_prompt: "Use $issueops to run the issue-driven cycle across 9 phases supported by 9 native agent-harness skills. von-neumann for strategic planning (problem→grill→issue→plan phases), berners-lee for external research with cross-referenced sources, codd for database schema design (normalization audit, table sizing, indexing), dijkstra for algorithmic complexity optimization with benchmark evidence, hopper for systematic debugging (7-step reproduce→isolate→diagnose→fix method), turing for evidence-bound execution (main agent performs RED→GREEN→SURFACE→CLEAN TDD directly, Manual-QA across 4 channels, quantitative metrics tracking, adversarial reviewer gate), shannon for signal-to-noise measurement before/after ai-slop-clean, torvalds for git operations (atomic commits, rebase, bisect, worktree, post-merge cleanup), and atomic-commit-push for safe staging and push. Create and link the Korean remote issue, derive a prefix branch, create an isolated worktree, write an issue-based plan, implement with direct TDD plus specialized skill support, run shannon SNR measurement + ai-slop-clean + re-measure before PR/MR drafting, collect feedback, resolve addressed review threads, draft a Korean PR/MR, offer explicit numbered choices, and verify the 100-point IssueOps benchmark gate."
