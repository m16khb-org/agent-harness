version: 2

project_name: agent-harness

before:
  hooks:
    - go mod tidy

builds:
  - id: agent-harness
    main: ./cmd/harness
    binary: agent-harness
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: agent-harness
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: m16khb
    name: agent-harness

# Publishes a Homebrew cask into this same repo under Casks/ via a pull request
# (no separate tap repo, no PAT). goreleaser deprecated `brews` (formula) in favor
# of `homebrew_casks` for pre-built binaries; the cask installs the embedded
# binary and goreleaser handles the macOS quarantine attribute. Protected main is
# respected because the cask arrives as a PR using the default GITHUB_TOKEN.
# Install after the cask PR merges:
#   brew tap m16khb/agent-harness https://github.com/m16khb/agent-harness
#   brew install --cask agent-harness
# Users still run `agent-harness install-native` once to wire hooks/MCP per host.
homebrew_casks:
  - name: agent-harness
    repository:
      owner: m16khb
      name: agent-harness
      branch: "homebrew-cask-{{ .Version }}"
      pull_request:
        enabled: true
        base:
          branch: main
    directory: Casks
    homepage: "https://github.com/m16khb/agent-harness"
    description: "Shared Codex/Claude Code agent harness CLI, MCP, and hooks"
    caveats: |
      Wire the native Codex/Claude integrations (hooks, MCP, skills) with:
        agent-harness install-native
      The agent-harness daemon auto-starts when a host launches the MCP server.
