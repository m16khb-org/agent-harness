version: 2

project_name: agent-harness

before:
  hooks:
    - go mod tidy

builds:
  - id: agent-harness
    main: ./cmd/harness
    binary: agent-harness
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: agent-harness
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: m16khb
    name: agent-harness

# Publishes the Homebrew formula into this same repo under Formula/ via a pull
# request (no separate tap repo, no PAT). The release workflow uses the default
# GITHUB_TOKEN; protected main is respected because the formula arrives as a PR.
# Install after the formula PR merges:
#   brew tap m16khb/agent-harness https://github.com/m16khb/agent-harness
#   brew install agent-harness
# The formula installs the self-contained binary (skills/configs are embedded);
# users still run `agent-harness install-native` once to wire hooks/MCP per host.
brews:
  - name: agent-harness
    repository:
      owner: m16khb
      name: agent-harness
      branch: "homebrew-formula-{{ .Version }}"
      pull_request:
        enabled: true
        base:
          branch: main
    directory: Formula
    homepage: "https://github.com/m16khb/agent-harness"
    description: "Shared Codex/Claude Code agent harness CLI, MCP, and hooks"
    license: "MIT"
    install: |
      bin.install "agent-harness"
    caveats: |
      Wire the native Codex/Claude integrations (hooks, MCP, skills) with:
        agent-harness install-native
      The agent-harness daemon auto-starts when a host launches the MCP server.
    test: |
      system "#{bin}/agent-harness", "inspect", "--json"
